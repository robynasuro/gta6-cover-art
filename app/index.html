<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Lab — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Lab</h1>
    <p class="tag">Two photos, four panels, one poster. Everything runs offline — your photos never leave this machine.</p>

    <fieldset>
      <legend>Photos</legend>
      <label>Photo A <input id="photoA" type="file" accept="image/*"></label>
      <div class="row">
        <button id="sampleA-pier" type="button">A: Pier</button>
        <button id="sampleA-boulevard" type="button">A: Boulevard</button>
      </div>
      <label>Photo B <input id="photoB" type="file" accept="image/*"></label>
      <div class="row">
        <button id="sampleB-pier" type="button">B: Pier</button>
        <button id="sampleB-boulevard" type="button">B: Boulevard</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="picks">
        <label><input type="radio" name="layout" value="quad" checked> Quad Grid</label>
        <label><input type="radio" name="layout" value="hero"> Hero Split</label>
        <label><input type="radio" name="layout" value="bleed"> Full Bleed</label>
        <label><input type="radio" name="layout" value="tilt"> Tilted Stack</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div class="picks">
        <label><input type="radio" name="grade" value="sunset" checked> Sunset</label>
        <label><input type="radio" name="grade" value="neon"> Neon Night</label>
        <label><input type="radio" name="grade" value="gold"> Palm Gold</label>
        <label><input type="radio" name="grade" value="mono"> Mono Vice</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Panel</legend>
      <label>Panel
        <select id="panelSel">
          <option value="0">1 — top left</option>
          <option value="1">2 — top right</option>
          <option value="2">3 — bottom left</option>
          <option value="3">4 — bottom right</option>
        </select>
      </label>
      <p class="hint">Click a panel on the preview to select it.</p>
      <label>Shows
        <select id="panelSlot">
          <option value="A">Photo A</option>
          <option value="B">Photo B</option>
        </select>
      </label>
      <label>Zoom <input id="zoom" type="range" min="0.8" max="2.5" step="0.01" value="1"></label>
      <label>Shift left / right <input id="offX" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Shift up / down <input id="offY" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </fieldset>

    <fieldset>
      <legend>Lettering</legend>
      <label>Title <input id="title" type="text" maxlength="40" value="Coastal Heat"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Vice City nights"></label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <label>Size
        <select id="sizeSel">
          <option value="1080x1080">1080 x 1080 — square post</option>
          <option value="1080x1350">1080 x 1350 — portrait post</option>
          <option value="1920x1080">1920 x 1080 — wide post</option>
        </select>
      </label>
      <button id="export" type="button">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
